services:
  postgres:
    container_name: opennote-postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: manh
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: opennote_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opennote-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manh -d opennote_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: opennote-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - opennote-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-server:
    container_name: opennote-server
    build: . # Dockerfile ở thư mục gốc
    command:
      [
        "run",
        "--allow-net",
        "--allow-env",
        "--allow-read",
        "--allow-write",
        "--allow-ffi",
        "--config",
        "deno.jsonc",
        "openNote/Main.ts",
      ]
    restart: always
    ports:
      - "7000:7000"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - PORT=7000
      - DB_USER=manh
      - DB_PASSWORD=12345678
      - DB_NAME=opennote_db
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opennote-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health/ready"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  app-worker:
    # container_name: opennote-worker
    build: .
    command:
      [
        "run",
        "--allow-net",
        "--allow-env",
        "--allow-read",
        "--allow-write",
        "--allow-ffi",
        "--config",
        "deno.jsonc",
        "openNote/interface/worker/Worker.ts",
      ]
    restart: always
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opennote-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/worker_heartbeat && find /tmp/worker_heartbeat -mmin -1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  opennote-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
