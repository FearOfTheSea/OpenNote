services:
  postgres:
    container_name: opennote-postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: manh
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: opennote_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opennote-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manh -d opennote_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: opennote-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - opennote-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app-server:
    container_name: opennote-server
    image: localhost/opennote-server:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app_env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: manh
      DB_PASSWORD: 12345678
      DB_NAME: opennote_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 7000
      JWT_SECRET: bimat
      NODE_ENV: production
      SESSION_SECRET: very_unique_session_secret
    ports:
      - "7000:7000"
    networks:
      - opennote-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health/ready"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - backup_data:/app/interface/web/public/backups

  app-worker:
    container_name: opennote-worker
    image: localhost/opennote-server:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: deno run -A openNote/interface/worker/Worker.ts
    environment: *app_env
    networks:
      - opennote-net
    volumes:
      - backup_data:/app/interface/web/public/backups

volumes:
  postgres_data:
  redis_data:
  backup_data:

networks:
  opennote-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
