<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Add modal.css -->
    <link rel="stylesheet" href="/css/modal.css" />

    <!-- Add modal.js before other scripts -->
    <script src="/js/modal.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/shared.css" />
    <link rel="stylesheet" href="/css/editor.css" />
    <title>Edit Note - OpenNote</title>
</head>
<body>
<header class="editor-header">
    <button id="back-btn" class="btn-secondary">← Back</button>
    <input type="text" id="note-title" placeholder="Note title" class="title-input" />
    <div class="header-actions">
        <button id="save-btn" class="btn-primary">Save</button>
        <button id="delete-btn" class="btn-danger">Delete</button>
    </div>
</header>

<div class="editor-container">
    <div class="editor-sidebar">
        <div class="meta-section">
            <label>Folder</label>
            <select id="folder-select">
                <option value="">Select folder...</option>
            </select>
        </div>

        <div class="meta-section">
            <label>Tags</label>
            <div id="tag-list" class="tag-list"></div>
            <button id="add-tag-btn" class="btn-small">+ Add Tag</button>
        </div>

        <div class="meta-section">
            <small class="meta-info">
                Created: <span id="created-date">-</span><br>
                Modified: <span id="modified-date">-</span>
            </small>
        </div>
    </div>

    <div class="editor-main">
        <textarea id="note-content" placeholder="Start typing..."></textarea>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/editor.js"></script>
</body>
</html>
